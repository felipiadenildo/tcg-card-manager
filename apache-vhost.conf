# Overrides Apache's default vhost so the document root is public,
# not the project root. Everything outside public (config, data, sql)
# stays reachable to PHP through require/include, but not through a URL.
<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
